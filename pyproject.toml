[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-nmf-face-reconstruction"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "Pillow>=10,<13",
    "matplotlib>=3.7,<4",
    "pandas>=2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<10",
    "nbclient>=0.8,<1",
    "nbformat>=5.9,<6",
]
report = ["PyMuPDF>=1.23,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "robust_nmf.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
